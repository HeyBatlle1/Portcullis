# Render blueprint. Secrets are declared `sync: false`: Render asks for them in
# its dashboard and they never live in this repository.
services:
  - type: web
    name: portcullis
    runtime: rust
    plan: starter            # free instances sleep; a judge would meet a cold start
    buildCommand: cargo build --release --locked -p portcullis-mcp
    startCommand: ./target/release/portcullis serve
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_RECEIVER
        sync: false
      - key: PORTCULLIS_AGENT_TOKENS      # name:sha256 pairs from `portcullis mint-token`
        sync: false
      - key: PORTCULLIS_ALLOWED_HOSTS     # the service's public hostname
        sync: false
      - key: PAYPAL_PAYER_EMAIL           # optional
        sync: false
      - key: PAYPAL_VENDOR_CLIENT_ID      # the vendor's sandbox app, for invoices
        sync: false
      - key: PAYPAL_VENDOR_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY           # the demo, siege and audit-desk agents
        sync: false
      - key: AG_STUDIO_LICENSE            # optional; the desk shows a watermark without
        sync: false
      - key: PORTCULLIS_JUDGE_KEY         # optional; /judge?key= skips the public limits
        sync: false
