[package]
name = "portcullis-kernel"
description = "Deterministic policy kernel. Decides, and holds no model."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately thin. Nothing here reaches a network, a filesystem, a clock, or a
# language model — read the list and you have audited the kernel's reach.
[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"

[dev-dependencies]
sha2 = "0.10.9"
serde_json = "1.0.140"
