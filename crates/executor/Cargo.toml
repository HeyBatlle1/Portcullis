[package]
name = "portcullis-executor"
description = "Acts on adjudications. Talks to the PayPal sandbox, and nothing else."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Everything the kernel refuses to touch lives here: a network, a clock, async.
# The kernel-purity CI job polices the kernel's graph, not this one.
[dependencies]
portcullis-kernel = { path = "../kernel" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
